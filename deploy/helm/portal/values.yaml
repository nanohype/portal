# -- Replica counts for each component
replicaCount:
  server: 1
  worker: 1   # Only 1 worker recommended — River handles concurrency internally
  web: 1

# -- Container images.
#
# Fully qualified, because an unqualified name is not "unset" — `portal/server`
# is a valid reference to docker.io/portal/server, a repository this project
# does not own. A chart installed with its own defaults must either work or
# fail; pulling something else entirely is the one outcome that is neither.
#
# tag empty means the chart's appVersion, which is what release.yaml builds the
# images at. Pin one only to run a build the chart does not ship with.
image:
  server:
    repository: ghcr.io/nanohype/portal/server
    tag: ""
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/nanohype/portal/worker
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/nanohype/portal/web
    tag: ""
    pullPolicy: IfNotPresent
  migrate:
    repository: ghcr.io/nanohype/portal/migrate
    tag: ""
    pullPolicy: IfNotPresent

# -- Application configuration
# Secrets (jwtSecret, encryptionKey, githubClientSecret, webhookSecret, S3 creds)
# are stored in a Kubernetes Secret. Everything else goes in a ConfigMap.
config:
  # Server
  serverAddr: ":8080"
  serverBaseURL: "http://localhost:8080"      # Public URL — set to your domain in production
  webURL: "http://localhost:5173"             # Frontend URL — set to your domain in production
  environment: "production"                   # "development" | "staging" | "production" — fail closed: only "development" relaxes (dev login + default keys)
  logLevel: "info"                            # "debug" | "info" | "warn" | "error"
  shutdownTimeout: "15s"

  # Auth — create a GitHub OAuth App and set these
  githubClientID: ""
  githubClientSecret: ""
  # REQUIRED unless environment is "development". GitHub OAuth authenticates any
  # GitHub account, so this org is what limits sign-in to your people: the login
  # callback checks active membership (read:org) and rejects everyone else. The
  # server refuses to start without it outside development rather than admitting
  # every GitHub account.
  allowedGitHubOrg: ""                        # e.g. "nanohype"

  # Security — MUST change these in production
  jwtSecret: "dev-secret-change-in-production"
  jwtExpiration: "24h"
  encryptionKey: "dev-encryption-key-32bytes!!!!!!"  # Must be exactly 32 bytes
  webhookSecret: ""                                   # HMAC secret for GitHub webhooks

  # Executor — "local" runs tofu on the worker host, "kubernetes" uses ephemeral pods
  executorType: "local"
  executorNamespace: "portal"                  # K8s namespace for executor pods
  executorImage: ""                            # empty = ghcr.io/nanohype/portal/executor:<appVersion>
  # Repository for per-tofu-version executor images. A workspace that pins a
  # tofu version makes the executor resolve "<prefix>:tofu-<version>" instead of
  # executorImage, and the release tags the executor image that way too. Empty
  # = ghcr.io/nanohype/portal/executor.
  executorImagePrefix: ""

  # Worker
  workerConcurrency: "10"
  workerHealthAddr: ":8081"

  # Object store config (endpoint/bucket/region/creds) lives under objectStore below.

  # Database tuning
  dbMaxConns: "25"
  dbMinConns: "5"

# -- External Postgres + Redis. Portal bundles neither — point these at managed
# services (RDS / ElastiCache on a real hub; any reachable Postgres/Redis for kx).
# database.url is REQUIRED and carries credentials, so it lands in the Secret.
# redis.url is OPTIONAL: leave it empty to run the log streamer in-memory (no
# Redis). For local dev, `task dev` brings these up via docker-compose, not the chart.
database:
  url: ""   # REQUIRED unless externalSecret.enabled — postgres://user:pass@host:5432/portal?sslmode=require
redis:
  url: ""   # optional — redis://host:6379 ; empty = in-memory log streaming

# -- MinIO subchart (Bitnami)
# -- Object store (S3-compatible) for OpenTofu state + run logs. Portal speaks the
# generic S3 API (minio-go client, static creds), so this points at anything
# S3-compatible. No store is bundled — the chart stays off the deprecated Bitnami
# catalog, and the in-cluster/production home is real object storage:
#   - Real hub: an AWS S3 bucket + a scoped access key. endpoint:
#     s3.<region>.amazonaws.com, useSSL: true, region: <region>.
#   - kx / self-contained: point at an S3 bucket, or `helm install` a standalone
#     S3 store (e.g. the official MinIO or a SeaweedFS chart) and point endpoint here.
# accessKey/secretKey land in the portal Secret — for production prefer a sealed
# secret / external-secrets over plaintext values here.
objectStore:
  endpoint: ""              # e.g. s3.us-west-2.amazonaws.com  (required)
  bucket: portal
  region: us-east-1
  useSSL: true
  accessKey: ""             # S3 access key id
  secretKey: ""             # S3 secret access key

# -- Running as a Platform tenant: credentials from the substrate, not from values.
#
# The operator provisions this tenant's Aurora and ElastiCache from its Platform
# CR's spec.datastores, and RDS keeps the master credential in a Secrets Manager
# entry it names itself (rds!cluster-<id>). So the connection string cannot be a
# committed value: half of it is generated at provision time and the other half
# rotates.
#
# external-secrets composes it instead. The password never lands in a values
# file, a helm release, or this chart's own Secret — the ExternalSecret reads it
# at refresh and writes only the assembled URL.
#
# The endpoint halves are NOT secret and ride as plain values, which is what
# lets the ExternalSecret name one remote ref per credential instead of
# depending on something to have copied five fields into a bespoke secret. That
# copy is exactly the contract three tenant apps read today and nothing writes.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStore: aws-secrets-manager  # ClusterSecretStore installed by the catalog
  # Secrets Manager ARN of the RDS-managed master credential. rackctl reads it
  # from the tenant-substrate output; there is no name to guess.
  relationalSecretArn: ""
  # ARN of the cache AUTH token secret. Empty = no auth token, and the composed
  # REDIS_URL carries no credential.
  cacheSecretArn: ""

# -- Where the substrate lives. Not secret, so not in the ExternalSecret.
tenantInfra:
  relational:
    host: ""
    port: 5432
    database: portal
    sslMode: require
  cache:
    host: ""
    port: 6379

# -- Ingress
ingress:
  enabled: false
  className: nginx
  hosts:
    - host: portal.local
      paths:
        - path: /
          pathType: Prefix
  # tls:
  #   - secretName: portal-tls
  #     hosts:
  #       - portal.example.com

# -- Resource limits
resources:
  server:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  worker:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  web:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -- Per-process extra env, appended to the configmap + secret the chart already
# wires. extraEnvFrom pulls Secret/ConfigMap refs; extraEnv adds inline
# name/value (or valueFrom) entries. Main use: AWS credentials for the worker on a
# non-IRSA hub like kx — create a Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# / AWS_REGION and reference it here so the worker can mint EKS tokens (survives
# helm upgrade, unlike `kubectl set env`). On a real hub use serviceAccount.roleArn
# (IRSA) instead and leave these empty.
server:
  extraEnv: []
  extraEnvFrom: []
worker:
  extraEnv: []
  extraEnvFrom: []
  # extraEnvFrom:
  #   - secretRef:
  #       name: portal-aws

# -- ArgoCD cluster-registry sync (read path). When enabled, the worker
# discovers clusters from ArgoCD's cluster Secrets (no manual portal
# registration) and the chart creates the RBAC it needs: read Secrets in
# `namespace`, and watch Platform/Tenant CRs cluster-wide. Point orgID/
# accountID/createdBy at existing portal IDs. Requires the worker to run
# in-cluster.
argocdSync:
  enabled: false
  namespace: argocd
  syncInterval: "120s"
  orgID: ""
  accountID: ""
  createdBy: ""

# -- GitOps write paths. The worker commits rendered manifests (tenant charts,
# cluster CRs) to these repos over SSH. Set sshKey to a deploy key with write
# access to the repos; setting a repo URL enables that vend path. The key is
# mounted read-only on the worker and never exposed as an env var.
gitops:
  sshKey: ""                 # private deploy key (PEM); enables the SSH git remote
  # -- known_hosts for the GitOps remote. REQUIRED whenever sshKey is set: the
  # worker image ships no hosts file, so this is the only thing standing between
  # the deploy key and a machine that answers on the remote's address. Generate
  # with `ssh-keyscan github.com` and review the output before pasting it.
  knownHosts: ""
  authorName: "portal"
  authorEmail: "portal@local"
  clustersRepoURL: ""        # e.g. git@github.com:nanohype/clusters.git — enables cluster vend
  clustersRepoRef: "main"
  tenantsRepoURL: ""         # e.g. git@github.com:nanohype/tenants.git — enables tenant vend
  tenantsRepoRef: "main"

# -- The hub's Crossplane role ARN (eks-fleet-crossplane). On a CROSS-ACCOUNT vend
# (the Cluster sets vendRoleArn), portal stamps this onto spec.bootstrapAccessRoleArn
# so cluster-stack grants the hub a cluster-admin EKS access entry and the bootstrap
# Workspace's get-token can reach the spoke API. Empty = same-account vends only.
fleet:
  hubRoleArn: ""             # e.g. arn:aws:iam::111111111111:role/eks-fleet-crossplane

# -- Cluster provision watch-back (the vend loop's closing leg). When enabled,
# the worker — running in-cluster on the hub — polls each committed provision
# op's eks-fleet Cluster XR and auto-registers the cluster (as eks_iam) once its
# endpoint+CA are up. Enabling it grants the worker read RBAC on
# fleet.nanohype.dev/clusters. Inert off the hub (no in-cluster config).
clusterWatchback:
  enabled: false
  interval: "60s"

# -- Cluster health watcher. When enabled (in-cluster, on the hub) the worker
# reads each registered cluster's per-cluster ArgoCD Application
# (cluster-<env>-<name>, in argocdSync.namespace) for sync/health, and — for
# eks_iam clusters with serviceAccount.roleArn set — its EKS control plane via
# eks:DescribeCluster, projecting both onto the cluster row. Grants the worker
# read RBAC on argoproj.io/applications in argocdSync.namespace. The EKS read
# degrades gracefully (empty) until the assume-role grants eks:DescribeCluster.
clusterHealth:
  enabled: false
  interval: "120s"

# -- Break-glass unwedge (in-cluster, on the hub). The worker is always
# registered, but only does anything when an owner triggers an unwedge op on a
# spoke whose provider-opentofu Workspace is stuck on external-create-pending: it
# tears the spoke's tagged AWS resources down through the workload account's
# fleet-unwedge role, then patches the Workspace finalizers so the condemned
# object garbage-collects. Enabling it grants the worker patch RBAC on
# opentofu.m.upbound.io/workspaces (on top of the read the watch-back already
# needs). The AWS side is gated independently by the fleet-unwedge IAM role's
# trust + permissions boundary, so this RBAC alone tears nothing down.
unwedge:
  enabled: false

# -- Distributed tracing (OpenTelemetry → the in-cluster Grafana Agent's OTLP
# receiver, with Tempo behind it). Off by default; metrics (/metrics) are
# unaffected. service.name is set in code (portal-server / portal-worker), so
# only the endpoint, protocol, and head-sampling fraction are configured here.
tracing:
  enabled: false
  otlpEndpoint: "http://grafana-agent.observability.svc:4318"
  otlpProtocol: "http/protobuf"
  sampleRatio: "1"           # fraction of new traces sampled (1 = all, 0.1 = 10%)

# -- ServiceAccount portal's pods run under.
#
# `name` names an account this chart does NOT create — the case that matters is
# a Platform tenant, where the eks-agent-platform operator creates
# `tenant-runtime` in the tenant namespace and binds it to the tenant IAM role
# with an EKS Pod Identity association. Pods have to run AS that account or the
# association matches nothing and every AWS call falls through to a credential
# chain with nothing in it: the object store is unreachable while the pods stay
# Running and the release reports deployed.
#
# All three deployments take it, not just the worker. The server is what reads
# and writes the object store.
#
# Empty (the default) keeps the chart self-contained: the worker gets an account
# this chart creates when its in-cluster features are on, and the server and web
# pods run as `default`, which is correct off-EKS and for a local kind install.
#
# `roleArn` is the pre-Pod-Identity binding and applies only to the account this
# chart creates. Leave it empty under `name` — an account the operator owns
# takes no annotation from here, and Pod Identity needs none.
serviceAccount:
  name: ""                  # e.g. tenant-runtime — operator-owned, not created here
  roleArn: ""               # e.g. arn:aws:iam::111111111111:role/portal-worker
