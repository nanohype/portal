apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.config.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ .Values.config.encryptionKey | quote }}
  GITHUB_CLIENT_ID: {{ .Values.config.githubClientID | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.config.githubClientSecret | quote }}
  WEBHOOK_SECRET: {{ .Values.config.webhookSecret | quote }}
  S3_ACCESS_KEY: {{ .Values.objectStore.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.objectStore.secretKey | quote }}
  # Connection URLs carry credentials, so they live here, not the ConfigMap.
  #
  # Omitted entirely when externalSecret.enabled: the ExternalSecret writes
  # DATABASE_URL and REDIS_URL into its own Secret, and the deployments mount that
  # one AFTER this one so it wins. Emitting an empty DATABASE_URL here would be
  # worse than omitting it — envFrom takes the last value for a duplicate key, and
  # an empty string that happened to be ordered last is a database URL of "".
  {{- if not .Values.externalSecret.enabled }}
  DATABASE_URL: {{ required "database.url is required: point portal at a managed Postgres (e.g. RDS), or set externalSecret.enabled to compose it from the tenant substrate. There is no bundled database." .Values.database.url | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
