apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: portal-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "portal.image" (dict "img" .Values.image.migrate "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.image.migrate.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- if $.Values.externalSecret.enabled }}
            # After the chart's own Secret, deliberately: envFrom takes the LAST
            # value for a duplicate key, and this one carries the composed
            # DATABASE_URL/REDIS_URL.
            - secretRef:
                name: {{ $.Release.Name }}-tenant-secret
            {{- end }}
