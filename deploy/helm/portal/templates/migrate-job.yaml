apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: portal-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-migrate
    spec:
      restartPolicy: OnFailure
      {{- if .Values.serviceAccount.name }}
      # The same identity the deployments run as, for the same reason they all
      # share one: a NetworkPolicy or an audit query written against the tenant's
      # ServiceAccount should cover every pod the tenant runs, not three of four.
      #
      # This Job was the odd one out and ran as `default`, which is the worst pod
      # to leave unattributed — migrations are the only thing in the release that
      # mutates schema, so the one workload whose actions most need a name was the
      # one without one. It also silently held no Pod Identity credentials, which
      # costs nothing today (it reaches Postgres with the composed DSN and makes
      # no AWS call) and would fail confusingly the first time a migration needed
      # one.
      serviceAccountName: {{ include "portal.serviceAccountName" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "portal.image" (dict "img" .Values.image.migrate "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.image.migrate.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- if $.Values.externalSecret.enabled }}
            # After the chart's own Secret, deliberately: envFrom takes the LAST
            # value for a duplicate key, and this one carries the composed
            # DATABASE_URL/REDIS_URL.
            - secretRef:
                name: {{ $.Release.Name }}-tenant-secret
            {{- end }}
