{{- if .Values.gitops.sshKey }}
# The git deploy key the worker uses to push to the tenant/cluster GitOps repos.
# Mounted read-only at GITOPS_SSH_KEY_PATH on the worker — kept out of the env
# (envFrom) so the key never lands in the process environment.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-git-ssh
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  id_ed25519: |
    {{- .Values.gitops.sshKey | nindent 4 }}
  # Host-key verification is what keeps this deploy key from being handed to
  # whatever answers on the remote's address, so the chart refuses to install a
  # key it cannot verify a host against rather than deferring the failure to the
  # first push.
  known_hosts: |
    {{- required "gitops.knownHosts is required when gitops.sshKey is set — run `ssh-keyscan <host>` and paste the reviewed output" .Values.gitops.knownHosts | nindent 4 }}
{{- end }}
