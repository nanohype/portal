{{- if .Values.externalSecret.enabled -}}
{{- if not .Values.externalSecret.relationalSecretArn }}
{{- fail "externalSecret.enabled requires externalSecret.relationalSecretArn: RDS names the master credential itself (rds!cluster-<id>), so there is no name to guess. rackctl reads it from the tenant-substrate output." }}
{{- end }}
{{- if not .Values.tenantInfra.relational.host }}
{{- fail "externalSecret.enabled requires tenantInfra.relational.host: the RDS-managed secret carries username and password and nothing else, so the endpoint has to come from somewhere. It is not secret, which is why it is a plain value." }}
{{- end }}
# Composes DATABASE_URL (and REDIS_URL) from the tenant substrate.
#
# The credential half comes from Secrets Manager by ARN, because RDS names the
# entry itself — `rds!cluster-<id>` — and rotates the password behind that name.
# Reading it here rather than copying it into a values file is the difference
# between rotation working and rotation breaking the app.
#
# The endpoint half is plain values. It is not secret, and making it a remote ref
# would mean something has to write a bespoke five-field secret first — which is
# precisely the contract three tenant apps read today and nothing in the org
# creates.
#
# This Secret is mounted AFTER the chart's own, so these keys win. The chart's
# Secret omits them entirely when this is enabled, so there is nothing to race.
#
# v1, not v1beta1. The external-secrets the catalog installs still DECLARES v1beta1
# on the CRD but no longer serves it:
#
#   $ kubectl get crd externalsecrets.external-secrets.io \
#       -o jsonpath='{range .spec.versions[*]}{.name}{" served="}{.served}{"\n"}{end}'
#   v1      served=true
#   v1beta1 served=false
#
# A declared-but-unserved version is the confusing case: the CRD lists it, so the
# manifest looks like it targets something real, and helm fails at install with
# `no matches for kind "ExternalSecret" in version "external-secrets.io/v1beta1"`.
# Every field this template uses — refreshInterval, secretStoreRef, target.template
# and data[].remoteRef.property — is present in v1 unchanged, so this is a version
# bump and nothing more. The ClusterSecretStore it references was already v1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-tenant-secret
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-tenant-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgresql://{{ `{{ .pgUser }}` }}:{{ `{{ .pgPassword }}` }}@{{ .Values.tenantInfra.relational.host }}:{{ .Values.tenantInfra.relational.port }}/{{ .Values.tenantInfra.relational.database }}?sslmode={{ .Values.tenantInfra.relational.sslMode }}
        {{- if .Values.tenantInfra.cache.host }}
        {{- if .Values.externalSecret.cacheSecretArn }}
        REDIS_URL: >-
          rediss://:{{ `{{ .cacheAuthToken }}` }}@{{ .Values.tenantInfra.cache.host }}:{{ .Values.tenantInfra.cache.port }}
        {{- else }}
        REDIS_URL: >-
          redis://{{ .Values.tenantInfra.cache.host }}:{{ .Values.tenantInfra.cache.port }}
        {{- end }}
        {{- end }}
  data:
    # The RDS-managed secret holds exactly these two keys. Anything else about the
    # connection is above, as a value.
    - secretKey: pgUser
      remoteRef:
        key: {{ .Values.externalSecret.relationalSecretArn | quote }}
        property: username
    - secretKey: pgPassword
      remoteRef:
        key: {{ .Values.externalSecret.relationalSecretArn | quote }}
        property: password
    {{- if .Values.externalSecret.cacheSecretArn }}
    - secretKey: cacheAuthToken
      remoteRef:
        key: {{ .Values.externalSecret.cacheSecretArn | quote }}
    {{- end }}
{{- end }}
