apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: portal-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.server }}
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Scraped by the Grafana Agent → Amazon Managed Prometheus.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: portal-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.serviceAccount.name }}
      # The server is what reads and writes the object store, so it is the pod
      # that most needs the tenant identity — a Pod Identity association matches
      # on (namespace, service account), and `default` matches nothing.
      serviceAccountName: {{ include "portal.serviceAccountName" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Required by the Pod Security Standard `restricted`, which the
        # eks-agent-platform operator ENFORCES on every tenant namespace. Without it
        # the pod is not warned about — it is refused, while the Deployment is still
        # created and sits at 0/1 forever:
        #
        #   pods "portal-server-..." is forbidden: violates PodSecurity
        #   "restricted:latest": seccompProfile (pod or container "server" must set
        #   securityContext.seccompProfile.type to "RuntimeDefault" or "Localhost")
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "portal.image" (dict "img" .Values.image.server "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- if $.Values.externalSecret.enabled }}
            # After the chart's own Secret, deliberately: envFrom takes the LAST
            # value for a duplicate key, and this one carries the composed
            # DATABASE_URL/REDIS_URL.
            - secretRef:
                name: {{ $.Release.Name }}-tenant-secret
            {{- end }}
            {{- with .Values.server.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.server.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: portal-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: portal-server
    app.kubernetes.io/instance: {{ .Release.Name }}
