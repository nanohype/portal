{{- if include "portal.worker.needsServiceAccount" . }}
# RBAC for the worker's in-cluster work. Created when argocdSync, clusterWatchback,
# clusterHealth or unwedge is enabled, or when the executor runs in Kubernetes.
# The worker watches Platform/Tenant CRs and (for the provision watch-back) the
# eks-fleet Cluster XRs cluster-wide; with argocdSync it reads ArgoCD's cluster
# Secrets, and with clusterHealth the per-cluster ArgoCD Applications — both
# scoped to argocdSync.namespace. With executorType "kubernetes" it also runs each
# tofu operation as a pod of its own; that grant is the namespaced Role below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}  # IRSA — AWS creds for cluster-status reads
  {{- end }}
  labels:
    app.kubernetes.io/name: portal-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-worker
rules:
  - apiGroups: ["platform.nanohype.dev"]
    resources: ["tenants", "platforms"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.clusterWatchback.enabled }}
  # The provision watch-back reads vended-cluster XRs on the hub.
  - apiGroups: ["fleet.nanohype.dev"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if or .Values.clusterWatchback.enabled .Values.unwedge.enabled }}
  # The provider-opentofu Workspaces the cluster XRs drive. The watch-back reads
  # .status.conditions[] for the vend timeline; the break-glass unwedge worker
  # additionally patches metadata.finalizers to release a Workspace stuck on
  # external-create-pending, once it has cleared the spoke's AWS resources.
  - apiGroups: ["opentofu.m.upbound.io"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch"{{- if .Values.unwedge.enabled }}, "patch"{{- end }}]
  {{- end }}
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
{{- if .Values.argocdSync.enabled }}
---
# Read only ArgoCD's cluster Secrets, scoped to the argocd namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-argocd-reader
  namespace: {{ .Values.argocdSync.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-argocd-reader
  namespace: {{ .Values.argocdSync.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-argocd-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if eq .Values.config.executorType "kubernetes" }}
---
# The Kubernetes executor runs each tofu operation as a pod of its own in
# config.executorNamespace, staging the run's script in a ConfigMap and
# everything sensitive beside it in a Secret — the decrypted tfvars, the
# state-encryption passphrase, the prior state file.
#
# A namespaced Role, not a ClusterRole: the executor only ever addresses one
# namespace, and what it handles there is cleartext provider credentials.
# Narrowing further to the object names would be better still, but every name
# carries a run id and RBAC has no prefix match — the namespace is the boundary
# that can actually be expressed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-executor
  namespace: {{ .Values.config.executorNamespace }}
rules:
  # get + watch, not list: waitForPodPhase reads the one pod by name and then
  # watches it with a field selector, which authorizes as `watch` on the
  # resource. Nothing enumerates the namespace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # create + delete only. The worker writes these on the way into a run and
  # removes them on the way out; it never reads one back — a leftover from a
  # cancelled run is replaced by delete-then-create, not inspected. Granting
  # `get` here would let a compromised worker read every other run's Secret for
  # nothing in return.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-executor
  namespace: {{ .Values.config.executorNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.clusterHealth.enabled }}
---
# Read the per-cluster ArgoCD Applications (cluster-<env>-<name>) the health
# watcher surfaces, scoped to the argocd namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-argocd-apps-reader
  namespace: {{ .Values.argocdSync.namespace }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-argocd-apps-reader
  namespace: {{ .Values.argocdSync.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-argocd-apps-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
