# The Cluster API. Under Crossplane v2 the namespaced composite resource IS the
# API — users apply a `Cluster` in their team namespace; there is no separate claim.
# Spec fields track the landing-zone fleet/aws/cluster-stack entrypoint inputs (which
# wrap components/aws/{network,cluster}); status fields track its outputs.
#
# What that shape means is stated in the schema's own descriptions rather than only
# here, so `kubectl explain cluster` answers it against a live cluster and any
# generated reference reads the same text. A comment is invisible to both.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clusters.fleet.nanohype.dev
spec:
  scope: Namespaced
  group: fleet.nanohype.dev
  names:
    kind: Cluster
    plural: clusters
  defaultCompositionRef:
    name: cluster-aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Cluster is an order for one EKS cluster. Applying it in a team
            namespace vends a cluster into a workload account: the Composition
            renders provider-opentofu Workspaces over the landing-zone substrate,
            and the cluster's endpoint, CA, OIDC issuer and network identifiers
            are written back to status as they converge. The substrate stays the
            source of truth — this is the ordering API on top of it.
          properties:
            spec:
              type: object
              description: >-
                The order. Placement (which account and region), the cluster's
                shape (version, networking, node pools), and the cross-account
                vend credentials, mirroring the fleet/aws/cluster-stack
                entrypoint's inputs field-for-field.
              properties:
                # --- placement: which spoke account/region to vend into -------
                account:
                  type: string
                  maxLength: 12
                  description: >-
                    Workload AWS account id. Records the placement and feeds resource
                    tags. It does not select the account — spec.vendRoleArn does, being
                    the role the entrypoint's provider assumes — so the two must agree,
                    and admission requires this id to appear in that ARN. Leave
                    vendRoleArn empty for a same-account vend, where the hub's own
                    credentials are used and this field stands alone.
                region:
                  type: string
                  maxLength: 32
                  description: >-
                    AWS region the cluster is vended into. Any region is valid — the
                    tofu state backend is decoupled from it: state lives in the single
                    hub-account bucket named by spec.stateBucket, in spec.stateRegion,
                    never in a per-region bucket that would have to track this value.
                    So a vend into us-west-1 builds the cluster there but still stores
                    its state in the one hub bucket. A region-lock SCP on the target
                    account's OU can deny actions outside a permitted set, in which
                    case the region named here must be one that SCP permits.
                environment:
                  type: string
                  maxLength: 32
                  default: development
                  description: Environment tier (development | staging | production) — prefixes resource names + tags.
                team:
                  type: string
                  maxLength: 64
                  description: Owning team (tagging + ownership).
                vendRoleArn:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^arn:aws[a-z0-9-]*:iam::[0-9]{12}:role/.+$'
                  default: ""
                  description: >-
                    Cross-account role the entrypoint's provider assumes to provision
                    into a workload account. Empty = provision with the hub's own
                    credentials (same-account — e.g. the local kind-hub validation).
                clusterPermissionsBoundaryArn:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^arn:aws[a-z0-9-]*:iam::[0-9]{12}:policy/.+$'
                  default: ""
                  description: >-
                    Permissions-boundary ARN cluster-stack mints the cluster's IAM
                    roles with — the boundary of whichever fleet role runs the vend,
                    published to SSM by landing-zone: fleet-vend's
                    /eks-fleet/<env>/fleet-vend/vend_permissions_boundary_arn for
                    cross-account (set alongside vendRoleArn), fleet-hub's
                    /eks-fleet/<env>/fleet-hub/hub_permissions_boundary_arn for a
                    same-account hub vend. Enforcement lives in IAM, not here: the
                    fleet roles' CreateRole/AttachRolePolicy gate only allows role
                    writes carrying their exact boundary, so a weaker or missing
                    value can't mint a weaker role — the vend just fails. Empty =
                    ungated (e.g. the local kind hub on user credentials).
                operatorPermissionsBoundaryArn:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^arn:aws[a-z0-9-]*:iam::[0-9]{12}:policy/.+$'
                  default: ""
                  description: >-
                    Permissions-boundary ARN the bootstrap Workspace mints the
                    agent-platform operator role with. Same value + SSM source as
                    clusterPermissionsBoundaryArn (one fleet role runs both
                    Workspaces, and its IAM gate covers both); a separate field
                    because it feeds the cluster-bootstrap entrypoint's
                    operator_permissions_boundary_arn var. Empty = ungated.
                bootstrapAccessRoleArn:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^arn:aws[a-z0-9-]*:iam::[0-9]{12}:role/.+$'
                  default: ""
                  description: >-
                    For cross-account vends, the hub's Crossplane role ARN — granted
                    cluster-admin via an EKS access entry so the bootstrap Workspace's
                    ambient get-token can reach this cluster's API (get-token can't
                    present the fleet-vend external_id). Empty = same-account, where
                    the creator (the hub) is already admin.
                portalAccessRoleArn:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^arn:aws[a-z0-9-]*:iam::[0-9]{12}:role/.+$'
                  default: ""
                  description: >-
                    The portal worker's per-account spoke role ARN — granted a read
                    EKS access entry so portal reaches this cluster's API (mint
                    tokens, watch tenants) with the same role it uses for
                    eks:DescribeCluster. Empty = portal not wired for this cluster.
                dataKmsKeyArn:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^arn:aws[a-z0-9-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
                  default: ""
                  description: >-
                    The spoke's secrets-component data CMK ARN. The bootstrap
                    Workspace's agent-iam module encrypts the model-artifacts +
                    eval-reports buckets at rest with it (SSE-KMS). A spoke
                    prerequisite referenced by ARN — like vendRoleArn and the
                    permissions boundaries — not something the vend creates:
                    cluster-stack provisions only network + cluster (no secrets
                    module), so the order desk supplies the key the spoke's baseline
                    already published to SSM (/platform/<env>/secrets/kms-key-arn).
                    Empty = ungated local/hub validation, where no real
                    artifacts bucket is minted.
                ttlDays:
                  type: integer
                  default: 0
                  minimum: 0
                  description: >-
                    Days-to-live for an ephemeral spoke. 0 (default) = persistent:
                    tagged Lifecycle=persistent and never auto-reaped. >0 tags the
                    spoke Lifecycle=ephemeral + Expiry=<vend date + ttlDays> and the
                    hub reaper deletes this Cluster (a clean Crossplane teardown)
                    ttlDays after creation.
                # --- cluster (landing-zone components/aws/cluster) ------------
                clusterName:
                  type: string
                  maxLength: 12
                  pattern: '^[a-z0-9]([a-z0-9-]{0,10}[a-z0-9])?$'
                  description: >-
                    Cluster base name; the module prefixes it with environment to form the
                    EKS cluster name <environment>-<clusterName>. Required and unique per
                    (account, region, environment) — there is no default, because a shared
                    default collides the moment a second cluster is vended into one account
                    and environment. Must not equal the environment token. Capped at 12
                    characters so the derived <environment>-<clusterName> keeps the tightest
                    cluster-scoped S3 name (agent-iam's account+region-qualified
                    model-artifacts bucket) within S3's 63-char limit for a
                    9-character region token like us-east-1.
                clusterVersion:
                  type: string
                  maxLength: 16
                  default: "1.36"
                  description: Kubernetes version.
                endpointPublicAccess:
                  type: boolean
                  default: false
                  description: >-
                    Expose the EKS API on a public endpoint. Clusters vend private
                    by default; public access is explicit opt-in and must carry a
                    non-empty endpointPublicAccessCidrs allowlist (a CEL rule on
                    spec rejects public-with-empty at admission).
                endpointPublicAccessCidrs:
                  type: array
                  items: {type: string, maxLength: 43}
                  maxItems: 64
                  default: []
                  description: >-
                    CIDRs allowed to reach the public API endpoint. Required
                    (non-empty) when endpointPublicAccess is true; irrelevant while
                    the endpoint is private.
                systemNodes:
                  type: object
                  # Default the whole object (like network): a default on a nested
                  # field alone doesn't apply when systemNodes is omitted, which would
                  # leave the patched vars empty and fail tofu's number coercion.
                  default: {instanceTypes: ["m7g.xlarge", "m6g.xlarge"], minSize: 2, maxSize: 6, desiredSize: 2, diskSize: 100}
                  description: System node group (Bottlerocket / Graviton arm64).
                  properties:
                    instanceTypes:
                      type: array
                      items: {type: string, maxLength: 32}
                      maxItems: 32
                      default: ["m7g.xlarge", "m6g.xlarge"]
                    minSize: {type: integer, default: 2}
                    maxSize: {type: integer, default: 6}
                    desiredSize: {type: integer, default: 2}
                    diskSize: {type: integer, default: 100}
                # --- network (landing-zone components/aws/network) -----------
                network:
                  type: object
                  # Default the whole object: a default on a nested field alone doesn't
                  # apply when `network` is omitted, which would leave `mode` unset and the
                  # create sub-object empty, passing an empty vpc_cidr to tofu (same
                  # whole-object-default reason as systemNodes above).
                  default: {mode: create, create: {vpcCidr: "10.0.0.0/16", maxAzs: 3, natGateways: 1}}
                  description: >-
                    The VPC the cluster lands in. mode: create (default) provisions a
                    self-owned VPC first; mode: adopt participates in a VPC provisioned
                    elsewhere (a same-account shared VPC, or one shared cross-account via
                    AWS RAM), referencing it by ID. Populate the sub-object matching mode.
                  properties:
                    mode:
                      type: string
                      maxLength: 16
                      enum: [create, adopt]
                      default: create
                      description: >-
                        create — the stack owns a disposable VPC (subnets, endpoints,
                        egress, and the ELB role tags). adopt — the stack participates in
                        a VPC it does not own; the owner runs the VPC and the subnet
                        tagging, and the cluster references it by adopt.* IDs.
                    create:
                      type: object
                      # Whole-object default (like network / systemNodes): a default on a
                      # nested field alone doesn't apply when create is omitted, which
                      # would pass an empty vpc_cidr to tofu.
                      default: {vpcCidr: "10.0.0.0/16", maxAzs: 3, natGateways: 1}
                      description: Create-mode inputs — used when mode is create.
                      properties:
                        vpcCidr:
                          type: string
                          maxLength: 43
                          default: "10.0.0.0/16"
                          description: CIDR for the VPC (literal allocation). Mutually exclusive with ipamPoolId.
                        ipamPoolId:
                          type: string
                          maxLength: 64
                          default: ""
                          description: >-
                            IPAM pool the VPC CIDR is drawn from. Empty (default) = literal
                            allocation from vpcCidr. Cross-account this is the org IPAM env
                            sub-pool shared in over RAM.
                        ipamNetmaskLength:
                          type: integer
                          default: 0
                          description: >-
                            Netmask length of the CIDR to allocate from ipamPoolId (16-20;
                            subnets are carved 8 bits smaller than the VPC block, so a base
                            longer than /20 would drop below AWS's /28 minimum). 0 (default)
                            = literal allocation.
                        transitGatewayId:
                          type: string
                          maxLength: 64
                          default: ""
                          description: >-
                            Transit gateway the VPC attaches to. Empty (default) = local NAT
                            egress only. Requires an IPAM-allocated CIDR (set ipamPoolId), so
                            attached prefixes stay non-overlapping.
                        centralizedEgress:
                          type: boolean
                          default: false
                          description: >-
                            Route private egress through the transit gateway instead of a
                            local NAT gateway (zero NAT gateways). Requires transitGatewayId.
                        maxAzs:
                          type: integer
                          default: 3
                        natGateways:
                          type: integer
                          default: 1
                    adopt:
                      type: object
                      # Whole-object default so an adopt spec that omits the object still
                      # coerces cleanly; the CEL rules below require vpcId + subnetIds.private
                      # to be non-empty whenever mode is adopt.
                      default: {vpcId: "", subnetIds: {private: [], public: []}}
                      description: Adopt-mode inputs — used when mode is adopt.
                      properties:
                        vpcId:
                          type: string
                          maxLength: 64
                          default: ""
                          description: VPC ID to adopt. Required (non-empty) when mode is adopt.
                        subnetIds:
                          type: object
                          default: {private: [], public: []}
                          description: Subnet IDs in the adopted VPC.
                          properties:
                            private:
                              type: array
                              items: {type: string, maxLength: 64}
                              maxItems: 64
                              default: []
                              description: Private subnet IDs (required, non-empty, when mode is adopt).
                            public:
                              type: array
                              items: {type: string, maxLength: 64}
                              maxItems: 64
                              default: []
                              description: Public subnet IDs (empty is valid for a private-only cluster).
                  x-kubernetes-validations:
                    # adopt mode must reference a concrete VPC + at least one private
                    # subnet — mirrors landing-zone network's adopt_vpc_id /
                    # adopt_private_subnet_ids preconditions, enforced here at admission
                    # instead of at tofu plan (~20 min into the vend).
                    - rule: >-
                        self.mode != 'adopt' ||
                        (has(self.adopt) && self.adopt.vpcId != '' &&
                        has(self.adopt.subnetIds) && has(self.adopt.subnetIds.private) &&
                        self.adopt.subnetIds.private.size() > 0)
                      message: "network.mode: adopt requires network.adopt.vpcId and a non-empty network.adopt.subnetIds.private"
                    # centralized egress needs a transit gateway to route the default
                    # route to — mirrors landing-zone network's centralized_egress
                    # precondition.
                    - rule: >-
                        !has(self.create) || !has(self.create.centralizedEgress) ||
                        !self.create.centralizedEgress ||
                        (has(self.create.transitGatewayId) && self.create.transitGatewayId != '')
                      message: "network.create.centralizedEgress requires network.create.transitGatewayId"
                    # a VPC CIDR comes from exactly one source: an IPAM pool OR a literal
                    # vpcCidr, never both — mirrors landing-zone network's ipam_pool_id /
                    # vpc_cidr mutual-exclusion precondition.
                    - rule: >-
                        !has(self.create) || !has(self.create.ipamPoolId) ||
                        self.create.ipamPoolId == '' ||
                        !has(self.create.vpcCidr) || self.create.vpcCidr == '10.0.0.0/16'
                      message: >-
                        network.create.ipamPoolId and a non-default network.create.vpcCidr
                        are mutually exclusive — with an IPAM pool the CIDR is drawn from
                        the pool, so leave vpcCidr at its default
                # --- bootstrap (the second, post-Ready Workspace) ------------
                observabilityTier:
                  type: string
                  maxLength: 16
                  enum: [floor, full]
                  default: floor
                  description: >-
                    Which observability substrate this cluster runs. floor is
                    CloudWatch alone: the amazon-cloudwatch-observability addon
                    publishes Container Insights metrics, and the cluster's
                    OpenTelemetry gateway exports application metrics as CloudWatch
                    EMF and logs to CloudWatch Logs. full adds the in-cluster LGTM
                    stack (Loki, Tempo, kube-state-metrics, grafana-operator) and
                    Amazon Managed Prometheus / Grafana, which also requires the
                    managed-monitoring substrate to exist for this cluster.
                    Published as the observability/tier cluster-Secret label the
                    eks-gitops generators select on. Both tiers run the same
                    OpenTelemetry node agent and a gateway on the same
                    telemetry.monitoring.svc endpoint, so a tenant workload is
                    identical either way and only the destinations differ.
                    Defaults to floor — a vended cluster is born light, and opting
                    up is a deliberate act with a substrate prerequisite.
                enableAgentPlatform:
                  type: boolean
                  default: true
                  description: >-
                    Install the eks-agent-platform operator via GitOps: when true,
                    the bootstrap labels the in-cluster ArgoCD Secret so eks-gitops
                    reconciles the operator from the per-cluster OIDC/role
                    annotations. False installs the operator out of band (e.g. the
                    e2e harness, to avoid GitOps racing a locally-built image).
                    Either way the cluster is still bootstrapped (Cilium + ArgoCD +
                    the addon catalog): this flag only toggles the operator's GitOps
                    label on the in-cluster ArgoCD Secret — not whether the bootstrap
                    Workspace runs (it always renders once the cluster is Ready).
                tenantsRepoUrl:
                  type: string
                  maxLength: 512
                  default: ""
                  description: >-
                    SSH URL of the private tenants GitOps repo. When set, the
                    bootstrap registers a read-only deploy key + ArgoCD repo
                    credential so ArgoCD can pull portal-committed tenant manifests.
                gitopsRepoUrl:
                  type: string
                  maxLength: 512
                  default: "https://github.com/nanohype/eks-gitops.git"
                  description: >-
                    Git URL of the addon-catalog GitOps repo the spoke's app-of-apps
                    points at — this org's eks-gitops (or a fork of it). Defaults to
                    the org catalog; override only to vend against a fork. Required
                    non-empty and validated as a git URL by the substrate, so it is
                    always sent (unlike tenantsRepoUrl, which is optional).
                gitopsRepoBranch:
                  type: string
                  maxLength: 255
                  default: "main"
                  description: >-
                    Branch of the addon-catalog GitOps repo the spoke tracks.
                    Defaults to main.
                # --- the substrate the Workspace runs ------------------------
                moduleSource:
                  type: string
                  maxLength: 512
                  # Pinned to a landing-zone commit, not ?ref=main: provider-opentofu
                  # caches a module by its ref and never re-pulls on retry, so a moving
                  # ref makes a vend non-reproducible (and silently stale on a substrate
                  # bump). Keep in lockstep with the same default in
                  # compositions/cluster-aws.yaml; bump both to roll the substrate
                  # forward (the SHA is a landing-zone main commit).
                  default: "git::https://github.com/nanohype/landing-zone.git?ref=1b5714dd25b9d12d53aafafaee4c2cc851fa178e"
                  description: >-
                    Git source for the landing-zone repo the Workspace fetches; tofu runs
                    in the fleet/aws/cluster-stack subdir (set by the composition's
                    entrypoint), which needs the whole repo present. Must be https and
                    pinned to a full 40-character commit sha: the Workspace pod holds no
                    SSH key, and provider-opentofu caches a module by its ref and never
                    re-pulls, so a branch or tag resolves once and every later vend
                    reuses that copy — two clusters ordered from the same spec would run
                    different substrate. Point this at your own fork by changing the
                    host; what is constrained is the shape of the source, not who
                    publishes it. See docs/architecture.md.
                # --- the tofu state backend ----------------------------------
                # Both Workspaces complete the entrypoint's partial `backend "s3" {}`
                # from initArgs. These are spec fields rather than composition literals
                # because the bucket and its region are per-estate facts: a fork, a
                # second hub, or a region-locked account cannot use one hard-coded pair.
                # The state key is NOT a field — it is derived from the Cluster's
                # namespace + name so two same-named Clusters can never share state.
                stateBucket:
                  type: string
                  maxLength: 63
                  description: >-
                    S3 bucket holding every vended cluster's tofu state. One bucket in
                    the hub account for the whole fleet, provisioned by landing-zone's
                    fleet-hub component alongside the hub IRSA role — not by a vend, so
                    it must exist before the first Cluster is applied. The per-cluster
                    state key is derived (fleet/<namespace>/<name>/terraform.tfstate),
                    so this names only the bucket. Required and deliberately
                    undefaulted: an S3 bucket name is a global-namespace identifier
                    belonging to one account, so no value here could be correct for a
                    second deployment. Declare the hub's bucket rather than inheriting
                    someone else's.
                stateRegion:
                  type: string
                  maxLength: 32
                  description: >-
                    Region the stateBucket lives in. This is the bucket's own region,
                    deliberately NOT spec.region — the S3 backend validates the bucket
                    against it, and decoupling the two lets a vend into any region still
                    init against the one real state bucket. Required alongside
                    stateBucket because the two name one thing: where this fleet's state
                    lives. A region that merely looks plausible is worse than no value —
                    it inits against the wrong place instead of failing.
              required:
                - account
                - region
                - team
                - clusterName
                # The tofu S3 backend. Required rather than defaulted: any default here
                # is one deployment's answer, and the bucket half is a global-namespace
                # identifier owned by a specific account. An empty or wrong value is not
                # caught until `tofu init` runs inside a Workspace, twenty minutes
                # into the vend, with a message that names a bucket rather than the
                # field that chose it. `required` moves that to admission.
                - stateBucket
                - stateRegion
              x-kubernetes-validations:
                # The EKS cluster name is <environment>-<clusterName>; if the two are
                # equal the name doubles (development-development-*). Reject at admission
                # — this is the collision guard the whole cluster-naming scheme depends on.
                - rule: self.clusterName != self.environment
                  message: "clusterName must not equal environment (the cluster name would double, e.g. development-development)"
                # Public endpoint access is explicit opt-in and must carry its own
                # allowlist: an empty CIDR list reaches the cluster module as
                # ["0.0.0.0/0"], so reject public-with-empty at admission.
                - rule: >-
                    !has(self.endpointPublicAccess) || !self.endpointPublicAccess ||
                    (has(self.endpointPublicAccessCidrs) && self.endpointPublicAccessCidrs.size() > 0)
                  message: "endpointPublicAccess: true requires a non-empty endpointPublicAccessCidrs allowlist"
                # A cross-account vend runs as the workload account's fleet-vend
                # role, whose IAM gate rejects any role write that doesn't carry
                # its permissions boundary — a vend ordered without the boundary
                # ARNs 403s ~20 minutes into the apply. Reject it at admission.
                - rule: >-
                    !has(self.vendRoleArn) || self.vendRoleArn == "" ||
                    (has(self.clusterPermissionsBoundaryArn) && self.clusterPermissionsBoundaryArn != "" &&
                    has(self.operatorPermissionsBoundaryArn) && self.operatorPermissionsBoundaryArn != "")
                  message: >-
                    vendRoleArn requires clusterPermissionsBoundaryArn +
                    operatorPermissionsBoundaryArn (the fleet-vend boundary, SSM
                    /eks-fleet/<env>/fleet-vend/vend_permissions_boundary_arn)
                # The backend pair rides initArgs, where tofu resolves it long after
                # admission: an empty bucket or region renders `-backend-config=bucket=`
                # and fails `tofu init` with a message that names neither the Cluster nor
                # the empty field. `required` above catches omission; this catches the
                # other half — present but blank, which `required` permits.
                - rule: >-
                    (!has(self.stateBucket) || self.stateBucket != '') &&
                    (!has(self.stateRegion) || self.stateRegion != '')
                  message: "stateBucket and stateRegion must be non-empty (they complete the tofu S3 backend: name the hub bucket and the region it lives in)"
                # admission: the fields below identify WHICH infrastructure this
                # Cluster owns. Editing one on a live Cluster does not move anything —
                # it re-points the composition at a different target while the tofu
                # state still describes the old one.
                #
                # stateBucket and stateRegion are the worst of them: the backend moves,
                # tofu finds no state at the new location, and the next apply builds a
                # second cluster while the first is left running and unmanaged. region
                # and clusterName force a destroy-and-recreate of a cluster that is
                # already serving. network.mode swaps a created VPC for an adopted one.
                #
                # None of that is recoverable from the Cluster CR, and none of it is
                # visible at the moment of the edit — a one-word change is accepted, and
                # the consequence arrives on the next reconcile. A transition rule is the
                # only place to stop it, because only here is the previous value known.
                #
                # Changing the target is a new Cluster. Delete this one, or order another.
                - rule: self.region == oldSelf.region
                  message: "spec.region is immutable — it identifies the infrastructure this Cluster already owns; order a new Cluster instead"
                - rule: self.clusterName == oldSelf.clusterName
                  message: "spec.clusterName is immutable — changing it destroys and recreates a live cluster; order a new Cluster instead"
                - rule: self.stateBucket == oldSelf.stateBucket
                  message: "spec.stateBucket is immutable — moving the backend strands the existing tofu state and the next apply builds a second cluster"
                - rule: self.stateRegion == oldSelf.stateRegion
                  message: "spec.stateRegion is immutable — moving the backend strands the existing tofu state and the next apply builds a second cluster"
                # admission: moduleSource names the OpenTofu module the hub clones and
                # runs under its own IRSA, so its shape is a privilege boundary rather
                # than a formatting preference. Two properties are required of it.
                #
                # https, because the Workspace pod carries no SSH key, and a scheme
                # tofu resolves some other way (file::, s3::, a bare path) reaches
                # something the hub can read but a reviewer of this repo cannot.
                #
                # A 40-character commit sha, because provider-opentofu caches a module
                # by ref and never re-pulls it: a branch or tag resolves once, on
                # whichever node happened to fetch first, and every later vend silently
                # reuses that copy. A moving ref is therefore not a newer substrate, it
                # is an unknown one, and two clusters ordered from the same spec can run
                # different code.
                - rule: >-
                    !has(self.moduleSource) ||
                    self.moduleSource.matches('^git::https://[^?]+[.]git[?]ref=[0-9a-f]{40}$')
                  message: "moduleSource must be an https git source pinned to a full 40-character commit sha, e.g. git::https://github.com/<org>/landing-zone.git?ref=<sha>"
                # admission: account and vendRoleArn both name where the cluster goes,
                # and only one of them decides. vendRoleArn is the role the entrypoint's
                # provider assumes, so it selects the account the cluster is really built
                # in; account is recorded and tagged, and the composition never reads it.
                # Nothing reconciled the two, so a Cluster could declare one account and
                # vend into another, and every record downstream — tags, inventory, the
                # order desk's own view — would name the wrong one.
                #
                # The mismatch is invisible in both directions: nothing surfaces it at
                # apply time, and nothing surfaces it afterwards either, because the
                # record that would reveal the true account is the field that was wrong.
                #
                # An ARN carries its account between the fifth and sixth colon, so
                # requiring it to appear there makes the recorded account load-bearing
                # rather than decorative.
                - rule: >-
                    !has(self.vendRoleArn) || self.vendRoleArn == '' ||
                    self.vendRoleArn.contains('::' + self.account + ':')
                  message: >-
                    vendRoleArn must name the account in spec.account
                    (arn:aws:iam::<account>:role/...) — the role decides which account
                    the cluster is built in, so a mismatch would tag and record the
                    wrong one
            status:
              type: object
              description: >-
                What the vend produced. Populated from the Workspaces' outputs as
                they converge, and read by everything downstream — cluster-bootstrap,
                the agent-platform operator, and anyone connecting to the cluster.
              properties:
                clusterName: {type: string, maxLength: 64, description: The vended cluster's EKS name.}
                clusterEndpoint: {type: string, maxLength: 512, description: EKS API endpoint.}
                certificateAuthorityData: {type: string, maxLength: 32768, description: Base64 cluster CA.}
                clusterSecurityGroupId:
                  type: string
                  maxLength: 64
                  description: >-
                    The EKS-managed cluster security group. Rules that need to reach
                    the control plane target this, not the node groups' own groups.
                oidcProviderArn: {type: string, maxLength: 2048, description: IAM OIDC provider ARN.}
                oidcIssuer: {type: string, maxLength: 512, description: OIDC issuer URL (no scheme).}
                karpenterIamRoleArn:
                  type: string
                  maxLength: 2048
                  description: The instance-profile role Karpenter assigns to the nodes it launches.
                vpcId:
                  type: string
                  maxLength: 64
                  description: The cluster VPC, for peering and endpoint attachment.
                privateSubnetIds:
                  type: array
                  items: {type: string, maxLength: 64}
                  maxItems: 64
                  description: >-
                    Private subnet IDs of the cluster's VPC (cluster-stack's
                    private_subnet_ids output). cluster-bootstrap republishes them in
                    adopt mode (Secret annotation + ConfigMap CSV) so a participant that
                    can't discover subnets by owner tag still schedules nodes and places
                    internal load balancers correctly.
                publicSubnetIds:
                  type: array
                  items: {type: string, maxLength: 64}
                  maxItems: 64
                  description: >-
                    Public subnet IDs of the cluster's VPC (cluster-stack's
                    public_subnet_ids output). cluster-bootstrap republishes them in adopt
                    mode so scheme-aware injection places internet-facing load balancers
                    on public subnets.
                subnetAzIds:
                  type: array
                  items: {type: string, maxLength: 64}
                  maxItems: 64
                  description: >-
                    AWS AZ IDs (e.g. use1-az1) of the cluster's private subnets, in
                    privateSubnetIds order (cluster-stack's private_subnet_az_ids output).
                    AZ IDs, not AZ names — a name like us-east-1a maps to a different
                    physical zone per account, so it isn't meaningful across the account
                    boundary an adopted/shared subnet crosses; the AZ ID is the stable
                    cross-account identifier.
      additionalPrinterColumns:
        - name: REGION
          type: string
          jsonPath: .spec.region
          description: Region the cluster was vended into.
        - name: ACCOUNT
          type: string
          jsonPath: .spec.account
          description: Workload account the cluster was vended into.
        - name: ENDPOINT
          type: string
          jsonPath: .status.clusterEndpoint
          description: EKS API endpoint — empty until the vend converges.
