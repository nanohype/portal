# A composed URL carrying a credential name no list would contain, interpolated
# without urlquery beside two that are escaped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-tenant-secret
spec:
  target:
    template:
      data:
        DATABASE_URL: >-
          postgresql://{{ .pgUser | urlquery }}:{{ .pgPassword | urlquery }}@db.example.internal:5432/portal
        REPLICA_URL: >-
          postgresql://{{ .pgReplicaUser }}:{{ .pgReplicaPassword }}@replica.example.internal:5432/portal
