# Every interpolation escaped, including one no list would contain. A check that
# failed on any unknown name would reject this.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-tenant-secret
spec:
  target:
    template:
      data:
        DATABASE_URL: >-
          postgresql://{{ .pgUser | urlquery }}:{{ .pgPassword | urlquery }}@db.example.internal:5432/portal
        REPLICA_URL: >-
          postgresql://{{ .pgReplicaUser | urlquery }}:{{ .pgReplicaPassword | urlquery }}@replica.example.internal:5432/portal
