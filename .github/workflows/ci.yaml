name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fail the build on unformatted Go so formatting drift can't land on main.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "unformatted Go files:"; gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      # portal renders an eks-fleet Cluster CR against a schema eks-fleet owns.
      # The vendored copy is what the render is tested against, so a copy that
      # has been edited — or a pin that no longer describes the bytes beside it —
      # would make the contract test agree with itself and nothing else. Reads
      # upstream at the PINNED ref, never at its head, so this verdict stays a
      # function of the commit under test. (xrd:freshness asks the other
      # question, on a schedule.)
      - name: Cluster XRD pin fidelity
        run: scripts/xrd.sh check
      # portal validates a rendered tenant manifest against the operator's CRD
      # schemas before it writes one, and this is the only point on that path
      # where a check prevents the write rather than reporting it. The schemas
      # are vendored, so the same two failures apply: a copy edited to admit a
      # manifest the operator would reject, or a pin that no longer describes the
      # bytes beside it. Same pinned-ref reading as above.
      - name: Tenant CRD schema pin fidelity
        run: scripts/crd.sh check
      # Fail the build on a known CVE in a Go dependency or the stdlib — the
      # supply-chain gate that catches what Dependabot would only flag later.
      # Pinned scanner version; CVE data is still fetched live from vuln.go.dev.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
      # Runs the suite with coverage and enforces .coverage-floors: per-package
      # ratchets, plus per-file 100% on the security-critical path. A drop below
      # any floor fails the build.
      #
      # TEST_DATABASE_URL points the DB tier (repository, service, worker,
      # handler) at the service Postgres. It is not optional here: those tests
      # skip without it, and a skipped test lowers coverage rather than failing,
      # so the floors are calibrated against a run that includes them.
      - name: test with coverage floors
        run: scripts/coverage.sh
        env:
          TEST_DATABASE_URL: postgres://portal:portal@localhost:5432/postgres?sslmode=disable
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Fail the build on a high/critical CVE in an npm dependency.
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run lint
        working-directory: web
      # Fail the build on unformatted web sources — the biome counterpart to
      # the gofmt gate above. src/api/types.ts is biome-ignored (generated;
      # its byte-identity with the generator is asserted by the drift step below).
      - run: npm run format:check
        working-directory: web
      # The API contract is generated: api/openapi.yaml is the source of truth
      # and web/src/api/types.ts must match it. Regenerate + diff fails the
      # build on drift (same pattern as nanohype's verify:catalog).
      - name: API contract drift
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/types.ts
        working-directory: web
      # tsc -b is the real typecheck — the root tsconfig has files:[] + project
      # references, so `tsc --noEmit` against it checks nothing.
      - run: npx tsc -b
        working-directory: web
      - run: npx vite build
        working-directory: web
      # Coverage thresholds live in web/vite.config.ts, so vitest itself fails
      # the run when one is missed — no separate assertion step.
      - run: npm run test:coverage
        working-directory: web

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Helm lint
        run: helm lint deploy/helm/portal

      # The chart deliberately requires database.url (no bundled DB — point it at
      # a managed Postgres), so render with a dummy URL purely to exercise
      # templating in CI.
      #
      # Rendered twice. The defaults leave executorType "local", which emits no
      # ServiceAccount and no RBAC at all — so a default-only render validates
      # none of the objects the Kubernetes executor needs, and a malformed Role
      # would reach a cluster before anything looked at it.
      - name: Helm template
        run: |
          mkdir -p rendered
          helm template portal deploy/helm/portal \
            --set 'database.url=postgres://portal:portal@db.example.com:5432/portal?sslmode=require' \
            > rendered/portal.yaml
          helm template portal deploy/helm/portal \
            --set 'database.url=postgres://portal:portal@db.example.com:5432/portal?sslmode=require' \
            --set config.executorType=kubernetes \
            > rendered/portal-k8s-executor.yaml

      - name: Validate against Kubernetes schemas
        run: kubeconform -strict -ignore-missing-schemas -summary rendered/portal.yaml rendered/portal-k8s-executor.yaml

      # Source files are gated elsewhere; this asserts the RENDERED chart too —
      # a zero account id, placeholder token, or account-less ARN that only
      # appears after templating.
      - name: Assert no unfilled sentinels in rendered output
        uses: nanohype/nanohype/.github/actions/render-assert@main
        with:
          manifests: rendered
