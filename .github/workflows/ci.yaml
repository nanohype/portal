name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Fail the build on unformatted Go so formatting drift can't land on main.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "unformatted Go files:"; gofmt -l .; exit 1; }
      # go.mod has to describe what the code actually imports. A bot-authored
      # major bump adds the new module path without touching a single import,
      # so the old major keeps building the binary and the new one is inert —
      # every other check here passes on that, because the code it compiles is
      # unchanged. `tidy -diff` is the only gate that can see it: it fails on
      # a require nothing imports and on an import nothing requires.
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      # portal renders an eks-fleet Cluster CR against a schema eks-fleet owns.
      # The vendored copy is what the render is tested against, so a copy that
      # has been edited — or a pin that no longer describes the bytes beside it —
      # would make the contract test agree with itself and nothing else. Reads
      # upstream at the PINNED ref, never at its head, so this verdict stays a
      # function of the commit under test. (xrd:freshness asks the other
      # question, on a schedule.)
      - name: Cluster XRD pin fidelity
        run: scripts/xrd.sh check
      # portal validates a rendered tenant manifest against the operator's CRD
      # schemas before it writes one, and this is the only point on that path
      # where a check prevents the write rather than reporting it. The schemas
      # are vendored, so the same two failures apply: a copy edited to admit a
      # manifest the operator would reject, or a pin that no longer describes the
      # bytes beside it. Same pinned-ref reading as above.
      - name: Tenant CRD schema pin fidelity
        run: scripts/crd.sh check
      # Fail the build on a known CVE in a Go dependency or the stdlib — the
      # supply-chain gate that catches what Dependabot would only flag later.
      # Pinned scanner version; CVE data is still fetched live from vuln.go.dev.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
      # Runs the suite with coverage and enforces .coverage-floors: per-package
      # ratchets, plus per-file 100% on the security-critical path. A drop below
      # any floor fails the build.
      #
      # TEST_DATABASE_URL points the DB tier (repository, service, worker,
      # handler) at the service Postgres. It is not optional here: those tests
      # skip without it, and a skipped test lowers coverage rather than failing,
      # so the floors are calibrated against a run that includes them.
      - name: test with coverage floors
        run: scripts/coverage.sh
        env:
          TEST_DATABASE_URL: postgres://portal:portal@localhost:5432/postgres?sslmode=disable
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/apigen/package-lock.json
      - run: npm ci
        working-directory: web
      # The type generator lives in its own dependency tree. openapi-typescript
      # reaches the TypeScript compiler API through the bare `typescript`
      # specifier, so it pins the compiler of whatever tree it is installed in;
      # installed here it cannot pin web's. Its peer range predates both the
      # TypeScript it runs on and the one web typechecks with, hence the flag.
      - run: npm ci --legacy-peer-deps
        working-directory: tools/apigen
      # Fail the build on a high/critical CVE in an npm dependency. Both trees
      # are audited: the generator's dependencies leave web's lockfile but stay
      # in the build, so auditing only web would shrink what this gate covers.
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: tools/apigen
      - run: npm run lint
        working-directory: web
      # Fail the build on unformatted web sources — the biome counterpart to
      # the gofmt gate above. src/api/types.ts is biome-ignored (generated;
      # its byte-identity with the generator is asserted by the drift step below).
      - run: npm run format:check
        working-directory: web
      # The API contract is generated: api/openapi.yaml is the source of truth
      # and web/src/api/types.ts must match it. Regenerate + diff fails the
      # build on drift (same pattern as nanohype's verify:catalog). The
      # generator runs out of tools/apigen, so this step also asserts that the
      # isolated tree still produces the committed bytes.
      - name: API contract drift
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/types.ts
        working-directory: web
      # tsc -b is the real typecheck — the root tsconfig has files:[] + project
      # references, so `tsc --noEmit` against it checks nothing.
      - run: npx tsc -b
        working-directory: web
      - run: npx vite build
        working-directory: web
      # Coverage thresholds live in web/vite.config.ts, so vitest itself fails
      # the run when one is missed — no separate assertion step.
      - run: npm run test:coverage
        working-directory: web

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install kubeconform
        run: |
          # Retried, and downloaded to a file rather than piped: --retry restarts
          # the request body, so a retry mid-stream would feed tar the front of a
          # second copy on top of a partial first one. Fetch, then extract.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Helm lint
        run: helm lint deploy/helm/portal

      # The chart deliberately requires database.url (no bundled DB — point it at
      # a managed Postgres), so render with a dummy URL purely to exercise
      # templating in CI.
      #
      # Rendered twice, once per executor. The default is "kubernetes", which
      # emits the ServiceAccount and the Role the executor needs to create run
      # pods; "local" emits neither. Rendering only one of them would leave the
      # other's objects unvalidated, and a malformed Role reaches a cluster
      # before anything looks at it.
      - name: Helm template
        run: |
          mkdir -p rendered
          helm template portal deploy/helm/portal \
            --set 'database.url=postgres://portal:portal@db.example.com:5432/portal?sslmode=require' \
            > rendered/portal.yaml
          helm template portal deploy/helm/portal \
            --set 'database.url=postgres://portal:portal@db.example.com:5432/portal?sslmode=require' \
            --set config.executorType=local \
            > rendered/portal-local-executor.yaml

      - name: Validate against Kubernetes schemas
        run: kubeconform -strict -ignore-missing-schemas -summary rendered/portal.yaml rendered/portal-local-executor.yaml

      # The ExternalSecret composes DATABASE_URL and REDIS_URL from credentials
      # it reads at runtime, so what ships is a template the External Secrets
      # controller renders later — helm never sees the password, and neither
      # does kubeconform. That makes this the one object in the chart whose
      # correctness no other gate here can reach.
      #
      # A credential interpolated raw is valid YAML, valid Helm, and produces a
      # broken URL the moment the password contains a character URLs reserve.
      # RDS draws passwords from "any printable ASCII except /, ", @, or space",
      # which leaves # ? : [ ] in play; # is the worst of them, because
      # net/url.Parse reads it as the fragment delimiter and silently drops the
      # rest of the string — @host included. The failure surfaces from the app
      # as "invalid port after host", naming the username as the host, which
      # points at everything except the password that caused it.
      #
      # So: every credential in a composed URL goes through urlquery. Asserting
      # the absence of the bare form (rather than the presence of the piped one)
      # is deliberate — it fails on a NEW unescaped interpolation, not just on a
      # regression of these two.
      # The two chart assertions below derive what they check from the render.
      # This proves that: each runs against a fixture holding the defect it
      # exists to catch, built out of subjects no list of kinds or credential
      # names contains, paired with the same subjects done correctly. A rewrite
      # that narrowed either check back to a list fails here.
      #
      # The rejecting cases assert the message, not just the exit status. A
      # narrowed check finds nothing in a fixture of kinds it does not know and
      # exits on its own vacuity guard — non-zero, for the wrong reason, which
      # reads exactly like a catch.
      - name: Chart assertions catch what they claim to
        run: scripts/chart_assert.py selftest

      # One identity across the release. The chart says so on the web Deployment
      # — nginx makes no AWS call and still runs as the tenant SA, so that a
      # NetworkPolicy or an audit query written against it covers every pod the
      # tenant runs. An unattributed pod is a hole in that claim, not a detail.
      #
      # The subjects are found by structure: a pod spec is a mapping carrying a
      # `containers` list, which is what the Kubernetes API means by one. Keying
      # on `kind` instead would check the kinds whoever wrote the gate thought
      # of and report success on the rest — a bare Pod, the ordinary form for a
      # helm hook or a one-shot job, would have shipped unattributed and green.
      - name: Every pod-bearing workload runs as the tenant ServiceAccount
        run: |
          helm template portal deploy/helm/portal \
            --set 'database.url=postgres://portal:portal@db.example.com:5432/portal?sslmode=require' \
            --set serviceAccount.name=tenant-runtime \
            > rendered/portal-sa.yaml
          scripts/chart_assert.py serviceaccounts rendered/portal-sa.yaml

      # The ExternalSecret composes DATABASE_URL and REDIS_URL from credentials
      # it reads at runtime, so what ships is a template the External Secrets
      # controller renders later — helm never sees the password, and neither
      # does kubeconform. That makes this the one object in the chart whose
      # correctness no other gate here can reach.
      #
      # A credential interpolated raw is valid YAML, valid Helm, and produces a
      # broken URL the moment the password contains a character URLs reserve.
      # RDS draws passwords from "any printable ASCII except /, ", @, or space",
      # which leaves # ? : [ ] in play; # is the worst of them, because
      # net/url.Parse reads it as the fragment delimiter and silently drops the
      # rest of the string — @host included. The failure surfaces from the app
      # as "invalid port after host", naming the username as the host, which
      # points at everything except the password that caused it.
      #
      # The subjects are the interpolations the render contains, read out of the
      # rendered templates. A gate holding its own list of credential names
      # covers those names and reports success on a new one, which is the case
      # that matters: the names it knows are the ones already escaped.
      - name: Assert composed URLs percent-encode their credentials
        run: |
          helm template portal deploy/helm/portal \
            --set externalSecret.enabled=true \
            --set 'externalSecret.relationalSecretArn=arn:aws:secretsmanager:us-west-2:111111111111:secret:rds!cluster-probe' \
            --set tenantInfra.relational.host=db.example.internal \
            --set tenantInfra.cache.host=cache.example.internal \
            --set 'externalSecret.cacheSecretArn=arn:aws:secretsmanager:us-west-2:111111111111:secret:cache-probe' \
            > rendered/portal-externalsecret.yaml
          scripts/chart_assert.py urlquery rendered/portal-externalsecret.yaml

      # Source files are gated elsewhere; this asserts the RENDERED chart too —
      # a zero account id, placeholder token, or account-less ARN that only
      # appears after templating.
      - name: Assert no unfilled sentinels in rendered output
        uses: nanohype/nanohype/.github/actions/render-assert@main
        with:
          manifests: rendered

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        ci,
        chart,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
