name: Tenant CRD schema freshness
# Asks whether the pinned eks-agent-platform CRD schemas are behind upstream.
#
# Deliberately not part of CI. Pull-request CI verifies that the vendored copy
# and its pin agree with each other and with upstream AT THAT PIN — a verdict
# about the commit under test. Whether the pin is also the newest thing
# the operator repo has is a different question with a different answer every day, and
# answering it in CI would turn a required check red because someone pushed to
# another repository.
#
# But a scheduled red run is not a signal anyone receives. This job had been red
# for two consecutive weeks while the vendored Platform schema drifted far enough
# to lose a validation bound the operator had already gained, and nothing said so.
# So drift files an ISSUE — one, edited in place rather than re-commented, closed
# automatically when the pin catches up. The run still goes red; the issue is what
# makes the red durable.
#
# The three exits are distinct on purpose. 0 is current, 2 is behind, and anything
# else means the check could not reach a verdict at all — a broken lookup must not
# be filed as confirmed drift, nor drift dismissed as a broken lookup.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  freshness:
    runs-on: ubuntu-latest
    env:
      DRIFT_LABEL: schema-drift
      DRIFT_TITLE: "CRD schema pin is behind eks-agent-platform"
    steps:
      - uses: actions/checkout@v4

      - name: Is the pin behind upstream?
        id: freshness
        run: |
          set -uo pipefail
          # Redirect to a file and read $? from the script itself. Reading an exit
          # code off the end of a pipeline reports the LAST command's status, which
          # is how a check ends up reporting `tee` succeeded.
          scripts/crd.sh freshness > freshness.log 2>&1
          code=$?
          cat freshness.log
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<REPORT_EOF'
            cat freshness.log
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          # 0 and 2 are verdicts and are handled in the steps below. Anything else
          # is the check failing to run, and fails the job here where the log is.
          if [[ "$code" -ne 0 && "$code" -ne 2 ]]; then
            echo "::error::scripts/crd.sh freshness exited ${code} — it could not reach a verdict"
            exit 1
          fi

      - name: File the drift issue
        if: steps.freshness.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.freshness.outputs.report }}
        run: |
          set -euo pipefail
          gh label create "$DRIFT_LABEL" \
            --color B60205 \
            --description "A vendored upstream copy is behind the repo it was copied from" \
            2>/dev/null || true

          body=$(cat <<EOF
          The vendored CRD schemas in \`internal/tenantmanifest/schemas\` are pinned to a commit
          that is no longer the newest \`operators/config/crd/bases\` in
          [nanohype/eks-agent-platform](https://github.com/nanohype/eks-agent-platform).

          \`\`\`
          ${REPORT}
          \`\`\`

          **Why this matters more than it reads.** Every bound the operator's CRD gains — a
          \`maxItems\`, a \`pattern\`, an enum — is enforced by portal only after this pin moves.
          Until then portal will accept and commit a tenant manifest the apiserver will reject,
          and the rejection lands in ArgoCD rather than in front of the person who typed it.

          Re-vendor and re-run the schema tests:

          \`\`\`
          task crd:sync -- <sha>
          go test ./internal/tenantmanifest/
          \`\`\`

          Read the schema diff before merging — a new constraint upstream usually implies a
          validation or form change here. This issue closes itself once the pin is current.
          EOF
          )

          existing=$(gh issue list --state open --label "$DRIFT_LABEL" --json number,title \
            --jq "[.[] | select(.title == \"${DRIFT_TITLE}\")] | .[0].number // empty")

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body "$body"
            echo "updated issue #${existing}"
          else
            gh issue create --title "$DRIFT_TITLE" --label "$DRIFT_LABEL" --body "$body"
          fi

      - name: Close the drift issue
        if: steps.freshness.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --label "$DRIFT_LABEL" --json number,title \
            --jq "[.[] | select(.title == \"${DRIFT_TITLE}\")] | .[0].number // empty")
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "The pin is current again — closed by the scheduled freshness check."
          fi

      - name: Fail while the pin is behind
        if: steps.freshness.outputs.code == '2'
        run: exit 1
